titulo: Cadastros
descricao: As listas que o resto da plataforma usa, e as pessoas com quem você trabalha.
ordem: 2
quem: [gestor, corretor]
# Cada aula é um vídeo do Treinamento. `guia` é o guia escrito relacionado
# (opcional); `video` é o slug em src/content/videos (sem ele: "vídeo em breve").
aulas:
  - slug: cadastros-auxiliares
    titulo: "Cadastros auxiliares: tipos, comodidades e outras listas"
    descricao: "As listas que o corretor escolhe na ficha do imóvel: tipos de imóvel, comodidades, proximidades, itens de condomínio, acabamentos e marcadores."
    guia: imoveis/cadastros-auxiliares
  - slug: configuracoes-de-imoveis
    titulo: "Configurações de Imóveis: marca d'água e imóveis próximos"
    descricao: "Escolher o logo da marca d'água, o tamanho e a transparência, se ela vem ligada nos imóveis novos, e o raio dos imóveis próximos."
    guia: imoveis/configuracoes-de-imoveis
  - slug: cadastrar-um-contato
    titulo: "Cadastrar um contato"
    descricao: "Como cadastrar uma pessoa ou empresa em Contatos, com CPF/CNPJ e endereço pelo CEP."
    guia: contatos/cadastrar-um-contato
  - slug: condominios
    titulo: "Condomínios: cadastrar e vincular unidades"
    descricao: "Cadastrar um condomínio ou empreendimento, ligar os imóveis a ele e publicar a página do condomínio no site."
    guia: imoveis/condominios
