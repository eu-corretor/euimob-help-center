titulo: Contatos
descricao: "As pessoas e empresas com quem você trabalha: clientes, proprietários e parceiros."
ordem: 2
quem: [gestor, corretor]
# Cada aula é um vídeo do Treinamento. `guia` é o guia escrito relacionado
# (opcional); `video` é o slug em src/content/videos (sem ele, a aula fica fora do site até ter vídeo).
aulas:
  - slug: cadastrar-um-contato
    titulo: "Cadastrar um contato"
    descricao: "Como cadastrar uma pessoa ou empresa em Contatos, com CPF/CNPJ e endereço pelo CEP."
    guia: contatos/cadastrar-um-contato
  - slug: gerenciar-seus-contatos
    titulo: "Gerenciar seus contatos"
    descricao: "Escolher as colunas da lista, editar a ficha e o tipo do contato, registrar notas, ver o histórico e abrir as oportunidades ligadas a ele."
    guia: contatos/cadastrar-um-contato
    video: contatos-gerenciar-contatos
  - slug: tipos-de-contato-personalizados
    titulo: "Tipos de contato personalizados"
    descricao: "Criar um tipo de contato próprio, como Investidor Estrangeiro, para classificar a sua base do jeito que a imobiliária trabalha."
    guia: contatos/cadastrar-um-contato
    video: contatos-tipo-de-contato-personalizado
