<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Editor · Central de Ajuda EuImob</title>
  </head>
  <body>
    <!--
      Sveltia CMS: compatível com a configuração do Decap CMS (config.yml ao
      lado), com editor mais leve e autenticação GitHub por um Worker do
      Cloudflare (ver interno/como-usar-o-editor.md). Para voltar ao Decap,
      troque o script por https://unpkg.com/decap-cms@^3/dist/decap-cms.js

      A versão é fixa e conferida por hash (integrity). Para atualizar, troque
      a versão na URL e recalcule:
      curl -sL <url> | openssl dgst -sha384 -binary | openssl base64 -A
    -->
    <script
      src="https://unpkg.com/@sveltia/cms@0.227.0/dist/sveltia-cms.js"
      integrity="sha384-GPE8FEk1RGNLIlJX+FpeLTak6r5qHQ7pDdYEDH3bUEFVwoI2LYlMp5u/Iw4Ej00o"
      crossorigin="anonymous"
      type="module"
    ></script>
  </body>
</html>
